submission:
  title: "ArcGuardAI — Clinical Trial Protocol Risk Intelligence Engine"

  problem_statement: >
    Clinical trials frequently suffer from unmonitored protocol deviations, wrong dosing, missed visits, and prohibited concomitant medications that compromise patient safety, jeopardize study integrity, and result in regulatory inspection failures. Clinical Operations teams lack leading-indicator risk intelligence to identify at-risk trial sites before deviations escalate into costly trial failures or audit reprimands.

  solution_summary: >
    ArcGuardAI is an auditable clinical intelligence platform that continuously evaluates trial records against active protocol parameters, calculates multi-dimensional risk scores across research sites, flags protocol deviations with GCP-grounded root cause evidence, and automates corrective and preventive action (CAPA) management across 200+ monitored sites.

  key_features:
    - "Automated Protocol Deviation Engine: flags wrong doses, visit window delays, missed visits, documentation gaps, and prohibited co-medications"
    - "Multi-Dimensional Site Risk Monitor: composite leading-indicator scoring across visit adherence, deviation density, query backlogs, and staff training"
    - "Participant Review & Longitudinal Timeline: dossier view tracking individual participant protocol compliance, domain adherence, and longitudinal visit milestones"
    - "End-to-End CAPA Quality Management: interactive List & Kanban boards tracking root-cause analysis, corrective actions, and effectiveness verification"
    - "Auditable Inspection Packages: exportable GCP regulatory packages, CSV registers, and complete audit logs with reviewer identity"

  tech_stack:
    languages: ["Python", "JavaScript", "HTML5", "CSS3"]
    frameworks: ["Vanilla JS", "Python Standard Library HTTP"]
    ibm_technologies: ["IBM Bob AI Assistant", "IBM Cloud Compatible Microservices Architecture"]
    databases: ["MongoDB"]
    other: ["Material Symbols", "Inter Font", "JetBrains Mono", "Docker", "GitHub Actions CI/CD"]

  what_we_are_most_proud_of: >
    The clinically authentic, human-centered UI matching enterprise clinical trial systems pixel-for-pixel, coupled with an auditable rule engine that computes real-time multi-factor risk scores and guides clinical trial monitors through GCP-aligned CAPA resolution.

  known_limitations: >
    Currently operating on synthetic Phase III cardiology trial dataset (ARC-2026-01) with local loopback authentication. Production deployment requires integration with enterprise EDC (Electronic Data Capture) systems via CDISC ODM-XML APIs, HTTPS/TLS, and OAuth2/SAML SSO.

